resources:
  handbook:
    requests:
      cpu: 5m
      memory: 5M
      # Bounds the nginx-tmp emptyDir. It holds only the pid file and nginx's
      # temp paths -- the site itself is baked into the image.
      ephemeralStorage: 50Mi
    limits:
      cpu: 50m
      memory: 30M
      ephemeralStorage: 200Mi

nginx:
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-giantswarm
      kubernetes.io/tls-acme: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

route:
  enabled: false
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: giantswarm-default
    namespace: envoy-gateway-system
  labels: {}
  annotations: {}

secrets: []

global:
  podSecurityStandards:
    enforced: false
